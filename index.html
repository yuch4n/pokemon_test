    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <script>
    const pokedex_no_min = 1;
    const pokedex_no_max = 1025;
    if(!localStorage.hasOwnProperty('pokemonNoStart')) localStorage.setItem('pokemonNoStart', pokedex_no_min);
    if(!localStorage.hasOwnProperty('pokemonNoEnd')) localStorage.setItem('pokemonNoEnd', pokedex_no_max);
    let no_min = Number(localStorage.getItem('pokemonNoStart'));
    let no_max = Number(localStorage.getItem('pokemonNoEnd'));

    let pokemon_name;

    const spinner = document.getElementById('loading-spinner');

    const rangeStartInput = document.getElementById('rangeStart');
    const rangeStartOutput = document.getElementById('rangeStartValue');
    const rangeStartUp = document.getElementById('rangeStartUp');
    const rangeStartDown = document.getElementById('rangeStartDown');
    const rangeEndInput = document.getElementById('rangeEnd');
    const rangeEndOutput = document.getElementById('rangeEndValue');
    const rangeEndUp = document.getElementById('rangeEndUp');
    const rangeEndDown = document.getElementById('rangeEndDown');

    rangeStartInput.value = no_min;
    rangeEndInput.value = no_max;

    rangeStartOutput.textContent = rangeStartInput.value;
    rangeEndOutput.textContent = rangeEndInput.value;

    rangeStartInput.addEventListener('input', function() {
      if(Number(this.value) > Number(rangeEndInput.value))
        this.value = rangeEndInput.value;
      rangeStartOutput.textContent = this.value;
    });
    rangeEndInput.addEventListener('input', function() {
      if(Number(this.value) < Number(rangeStartInput.value))
        this.value = rangeStartInput.value;
      rangeEndOutput.textContent = this.value;
    });
    rangeStartUp.addEventListener('click', function() {
      if(Number(rangeStartInput.value) < Number(rangeEndInput.value))
        rangeStartOutput.textContent = ++rangeStartInput.value;
    }, false);
    rangeStartDown.addEventListener('click', function() {
      if(Number(rangeStartInput.value) > pokedex_no_min)
        rangeStartOutput.textContent = --rangeStartInput.value;
    }, false);
    rangeEndUp.addEventListener('click', function() {
      if(Number(rangeEndInput.value) < pokedex_no_max)
        rangeEndOutput.textContent = ++rangeEndInput.value;
    }, false);
    rangeEndDown.addEventListener('click', function() {
      if(Number(rangeEndInput.value) > Number(rangeStartInput.value))
        rangeEndOutput.textContent = --rangeEndInput.value;
    }, false);

    // image loading spinner
    document.querySelector('#pokemon-image img').addEventListener('load', function() {
      spinner.classList.add('d-none');
    });

    // setting save
    document.getElementById('btn-save').addEventListener('click', function(event) {
      no_min = Number(rangeStartInput.value);
      no_max = Number(rangeEndInput.value);
      localStorage.setItem('pokemonNoStart', no_min);
      localStorage.setItem('pokemonNoEnd', no_max);
    }, false);

    // play button
    document.getElementById('btn-play').addEventListener('click', function(event) {
      document.getElementById('txt-answer').value = '';
      loadQuestion();
    }, false);

    // answer button
    document.getElementById('btn-answer').addEventListener('click', function(event) {
      let answer = document.getElementById('txt-answer').value;
      let answer_message = document.querySelector('#answerModal .modal-body');
      if(!pokemon_name) {
        answer_message.innerHTML = 'メニューの「開始」を押してください';
      } else {
        if(pokemon_name == answer) {
          answer_message.innerHTML = '<i class="bi bi-circle text-primary"></i> 正解';
          if(!localStorage.hasOwnProperty('answer_right')) {
            localStorage.setItem('answer_right', 1);
          } else {
            let answer_right = Number(localStorage.getItem('answer_right'));
            localStorage.setItem('answer_right', ++answer_right);
          }
        } else {
          if(!localStorage.hasOwnProperty('answer_wrong')) {
            localStorage.setItem('answer_wrong', 1);
          } else {
            let answer_wrong = Number(localStorage.getItem('answer_wrong'));
            localStorage.setItem('answer_wrong', ++answer_wrong);
          }
          answer_message.innerHTML = '<i class="bi bi-x text-danger"></i> 不正解<br />正解は ' + pokemon_name;
        }
      }
    }, false);

    // next button
    document.getElementById('btn-next').addEventListener('click', function(event) {
      document.getElementById("txt-answer").value = '';
      loadQuestion();
    }, false);

    // achievements menu
    document.getElementById('btn-achievements').addEventListener('click', function(event) {
      let achievements_message = document.querySelector('#achievementsModal .modal-body');
      achievements_message.innerHTML = '';
      let answer_right = Number(localStorage.getItem('answer_right'));
      let answer_wrong = Number(localStorage.getItem('answer_wrong'));
      let answer_total = answer_right + answer_wrong;
      let answer_avg;
      if(answer_total > 0) {
        answer_avg = Math.floor(answer_right / (answer_right+answer_wrong) * 100);
      } else {
        answer_avg = 0;
      }
      achievements_message.innerHTML = answer_total+'問中 '+answer_right+'問正解<br />正解率 '+answer_avg+'%';
    }, false);

    // achievements reset
    document.getElementById('btn-achievements-reset').addEventListener('click', function() {
      localStorage.removeItem('answer_right');
      localStorage.removeItem('answer_wrong');
    }, false);

    // load question
    async function loadQuestion() {
      document.querySelector('#pokemon-image img').src = '';
      spinner.classList.remove('d-none');
      let num = Math.floor(Math.random() * (no_max - no_min + 1)) + no_min;
      //console.log(no_min, no_max, num);
      try {
        let nameRes = await fetch('https://pokeapi.co/api/v2/pokemon-species/'+num);
        let nameJson = await nameRes.json();
        pokemon_name = nameJson.names.find(item => item.language.name === 'ja')?.name;

        let imageRes = await fetch('https://pokeapi.co/api/v2/pokemon/'+num);
        let imageJson = await imageRes.json();
        let pokemon_image = imageJson['sprites']['other']['official-artwork']['front_default'];
        document.querySelector('#pokemon-image img').src = pokemon_image;
      } catch (err) {
        console.error('エラーが発生しました:', err);
      }
    }
    </script>
